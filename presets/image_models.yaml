# Selectable reference-image models. All run inside the image-worker container with diffusers (no external service).
#   family qwen   : Qwen-Image-2512, whole transformer GPU-resident as fp8 storage / bf16 compute (mode fp8_resident;
#                   built once from the HF bf16 weights with the Lightning LoRA fused in bf16, cached in the models volume).
#                   mode bf16_split (bf16 with block offload, ~4x slower) remains available as a manual setting.
#   family klein  : FLUX.2 Klein 4B, transformer + Qwen3-4B text encoder loaded from the files already on disk in the
#                   ComfyUI models folder (mounted read-only at /extra-models); configs/VAE/tokenizer from the HF repo.
#   family zimage : Z-Image Turbo, same approach (bf16 single file + Qwen3-4B from the ComfyUI folder).
# `est_s` is the rough wall clock per image on the RTX 5090 (model load is paid once per job and amortised).
# Fast-model settings follow the vendors' reference configs and were checked on this card (docs/RESULTS.md):
#   FLUX.2 Klein (distilled): guidance 1.0 and 4 steps are fixed by the distillation (BFL flux2 `fixed_params`); resolution is
#   the free quality lever (16-px multiples, up to 4 MP). 1536² gives visibly finer material detail than 1024² at 2-5 s/image;
#   2048² works but peaks at 29 GB, which leaves no room for a concurrent Pixal3D run.
#   Z-Image Turbo: official num_inference_steps=9 (8 DiT passes) with guidance 0.0. guidance_scale 1.0 silently enables CFG
#   (diffusers treats >0 as CFG), doubling the cost for no gain.
# Availability is checked live in /capabilities (required files present in the caches/mounts).
- id: qwen-image-2512-lightning-8
  label: Qwen-Image-2512 Lightning (8 steps)
  tier: fast
  family: qwen
  est_s: 8
  description: Qwen-Image-2512 with the official 8-step Lightning LoRA, fp8 weights fully on the GPU. Won the first blind test on prompt adherence and clean surfaces; ~7 s per image. Superseded as default by Klein 9B at 2048².
  params: {steps: 8, true_cfg_scale: 1.0, width: 1328, height: 1328, mode: fp8_resident,
           lightning_lora: {repo: lightx2v/Qwen-Image-2512-Lightning, revision: a52649c9d0f6e1a248bff13f0df33bb8a2abdb52,
                            file: Qwen-Image-2512-Lightning-8steps-V1.0-bf16.safetensors}}
- id: qwen-image-2512-lightning-4
  label: Qwen-Image-2512 Lightning (4 steps)
  tier: fast
  family: qwen
  est_s: 4
  description: 4-step variant, ~4 s per image. Same compositions as 8 steps but thinner struts and busier bracing; use for rough iteration.
  params: {steps: 4, true_cfg_scale: 1.0, width: 1328, height: 1328, mode: fp8_resident,
           lightning_lora: {repo: lightx2v/Qwen-Image-2512-Lightning, revision: a52649c9d0f6e1a248bff13f0df33bb8a2abdb52,
                            file: Qwen-Image-2512-Lightning-4steps-V1.0-bf16.safetensors}}
- id: flux2-klein-4b
  label: FLUX.2 Klein 4B
  tier: fast
  family: klein
  est_s: 6
  description: Distilled FLUX.2 Klein 4B (bf16) at 1536², 4 steps, fully GPU-resident (~22 GB). About 2-3 s per image once loaded.
  params: {steps: 4, guidance_scale: 1.0, width: 1536, height: 1536,
           config_repo: black-forest-labs/FLUX.2-klein-4B, config_revision: e7b7dc27f91deacad38e78976d1f2b499d76a294,
           transformer_file: diffusion_models/flux-2-klein-4b.safetensors, text_encoder_file: text_encoders/qwen_3_4b.safetensors}
- id: z-image-turbo
  label: Z-Image Turbo
  tier: fast
  family: zimage
  est_s: 12
  description: Z-Image Turbo (bf16) at 1536², official Turbo settings (9 scheduler steps = 8 DiT passes, guidance 0). Strong material detail, ~9 s per image.
  params: {steps: 9, guidance_scale: 0.0, width: 1536, height: 1536,
           config_repo: Tongyi-MAI/Z-Image-Turbo, config_revision: f332072aa78be7aecdf3ee76d5c247082da564a6,
           transformer_file: diffusion_models/z_image_turbo_bf16.safetensors, text_encoder_file: text_encoders/qwen_3_4b.safetensors}
- id: flux2-klein-9b
  label: FLUX.2 Klein 9B (2048²)
  tier: fast
  family: klein
  est_s: 14
  recommended: true
  license: FLUX Non-Commercial License (accept on huggingface.co/black-forest-labs/FLUX.2-klein-9B)
  description: "Default, at maximum quality. Distilled FLUX.2 Klein 9B (on-disk fp8 transformer dequantized to bf16; full bf16 Qwen3-8B text encoder from the HF repo) at the 4 MP ceiling, 2048². Steps (4) and guidance (1.0) are fixed by the distillation (BFL reference config), so resolution and the text encoder are the only quality levers and both are maxed. ~29 GB peak - an asset-lane Pixal3D run waits for it (OOM wait/retry) rather than sharing the GPU."
  params: {steps: 4, guidance_scale: 1.0, width: 2048, height: 2048, distilled: true, sequential: true, text_encoder_from_hub: true,
           config_repo: black-forest-labs/FLUX.2-klein-9B, config_revision: 92196c8e11f7b6cf2b7493e037d8c5345c559216,
           transformer_file: diffusion_models/flux-2-klein-9b-fp8.safetensors, text_encoder_file: text_encoders/qwen_3_8b_fp8mixed.safetensors}
- id: qwen-image-2512
  label: Qwen-Image-2512 (50 steps, CFG 4)
  tier: quality
  family: qwen
  est_s: 85
  description: Undistilled 50-step sampling with CFG 4, fp8 weights on the GPU (~80 s per image). Rated below the Lightning output in the blind test (waxier, lower-contrast surfaces); kept as an option.
  params: {steps: 50, true_cfg_scale: 4.0, width: 1328, height: 1328, mode: fp8_resident}
